<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CleanDrop</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <header>
        <h1>CleanDrop</h1>
        <span>Download cleanup</span>
    </header>

    <section>

        <h2>Default deletion</h2>

        <label for="defaultDelete">
            Delete downloads after
        </label>

        <select id="defaultDelete">
            <option value="5">5 seconds (test)</option>
            <option value="3600">1 hour</option>
            <option value="21600">6 hours</option>
            <option value="86400">1 day</option>
            <option value="604800">7 days</option>
            <option value="1209600">14 days</option>
            <option value="2592000">30 days</option>
            <option value="-1">Never</option>
        </select>

    </section>

    <section>

        <h2>Scheduled deletions</h2>

        <div id="scheduledDownloads">
            Loading...
        </div>

    </section>

    <script src="popup.js"></script>

</body>
</html>

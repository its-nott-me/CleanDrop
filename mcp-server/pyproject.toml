[project]
name = "cleandrop-mcp"
version = "0.1.0"
description = "Local MCP server exposing CleanDrop's expiry-tracking database to AI assistants"
requires-python = ">=3.10"
# MCP Python SDK v2 renamed FastMCP -> MCPServer. Pinned to the major
# version this code was written and tested against (2.3.0).
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cleandrop-mcp = "cleandrop_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

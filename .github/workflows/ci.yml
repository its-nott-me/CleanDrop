name: CI

on:
  push:
    branches: [master]
    paths:
      - "mcp-server/**"
      - "companion/database.py"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - "companion/database.py"
      - ".github/workflows/ci.yml"

# cancel a superseded run when u push again to the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # CleanDrop is windows-only, so Windows is the one that matters; 
        # Linux gives a fast second opinion
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']

    defaults:
      run:
        working-directory: mcp-server

    steps:
      # Full checkout: tests import ../companion/database.py
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test 
        run: python -m pytest -q


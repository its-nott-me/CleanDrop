<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Schedule deletion</title>

    <link
        rel="stylesheet"
        href="duration.css"
    >

</head>

<body>

    <main>

        <h2>
            Schedule deletion
        </h2>


        <label for="duration">
            Delete after
        </label>


        <select id="duration">

            <option value="5">
                5 seconds (test)
            </option>

            <option value="3600">
                1 hour
            </option>

            <option value="21600">
                6 hours
            </option>

            <option value="86400">
                24 hours
            </option>

            <option value="604800">
                7 days
            </option>

            <option value="2592000">
                30 days
            </option>

        </select>


        <div class="actions">

            <button id="cancel">
                Cancel
            </button>

            <button id="schedule">
                Schedule
            </button>

        </div>

    </main>


    <script src="duration.js"></script>

</body>

</html>
